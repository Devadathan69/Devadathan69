name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-activity.yml
      - scripts/refresh_activity.py
      - scripts/comet_atlas.py
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: profile-activity

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read public contributions and render Comet Atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_activity.py
      - name: Publish updated activity
        run: |
          git add README.md assets/comet-atlas.svg assets/comet-atlas-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile activity'
          git push
